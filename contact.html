<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | K.L Logistics</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">K.L <span>Logistics</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="company.html">Company</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <a href="contact.html" class="btn btn-primary" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);">Get a Quote</a>
    </header>

    <div class="page-header">
        <h1>Get in Touch</h1>
        <p>Ready to optimize your supply chain? Request a quote today.</p>
    </div>

    <section class="section" style="padding-top: 0; max-width: 600px; margin: 0 auto;">
        <form style="display: flex; flex-direction: column; gap: 20px;">
            <input type="text" placeholder="Company Name" style="padding: 15px; background: var(--dark-lighter); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit;">
            <input type="email" placeholder="Work Email" style="padding: 15px; background: var(--dark-lighter); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit;">
            <select style="padding: 15px; background: var(--dark-lighter); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: inherit;">
                <option>Select Service Needed</option>
                <option>Ocean Freight</option>
                <option>Air Freight</option>
                <option>Road Transport</option>
                <option>Warehousing</option>
            </select>
            <textarea placeholder="Tell us about your shipping needs..." rows="5" style="padding: 15px; background: var(--dark-lighter); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit;"></textarea>
            <button type="submit" class="btn btn-primary" style="padding: 15px;">Request Quote</button>
        </form>
    </section>

    <footer style="margin-top: 100px;">
        <div class="footer-bottom" style="border: none; padding-top: 0;">© 2024 K.L Logistics. All rights reserved.</div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
